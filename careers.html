<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Career & Archive — .1VOYSY. Selected records of work, education, certifications, and professional development.">
  <meta name="theme-color" content="#FFFFFF">
  <title>.1VOYSY — Career / Archive ✻ 2026</title>
  <link rel="icon" type="image/svg+xml" href="/assets/hero-asterisk.svg">

  <!-- Preload Primary Editorial Typeface: PP Editorial New -->
  <link rel="preload" href="/fonts/EditorialNew-Variable.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Google Fonts: Cormorant Garamond, Instrument Serif, Inter, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="careers-page">

  <!-- Top Sticky Editorial Header -->
  <header class="careers-header" role="banner">
    <a href="/index.html" class="careers-brand-wrap" aria-label="Return to .1VOYSY Homepage">
      <span class="careers-brand-title">.1VOYSY</span>
    </a>

    <nav class="careers-nav-actions" aria-label="Archive Navigation">
      <a href="/index.html" class="careers-back-btn">
        <span>&larr;</span>
        <span>Back to Home</span>
      </a>
      <a href="/index.html#contact" class="careers-connect-btn">
        <span>Let’s Connect</span>
        <span aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </header>

  <!-- Main Archive Content -->
  <main class="careers-main">
    <section class="careers-hero" aria-label="Career and Archive Overview">
      <!-- Large Editorial Title + Description Grid -->
      <div class="careers-hero-grid">
        <h1 class="archive-headline">
          CAREER<br>
          ARCHIVE
        </h1>

        <div class="archive-desc-wrap">
          <p class="archive-subtext">
            Selected records of work, education, certifications and professional development.
          </p>
        </div>
      </div>

      <!-- Thin Horizontal Divider -->
      <div class="careers-divider" aria-hidden="true"></div>

      <!-- Minimalist Category Navigation -->
      <div class="careers-controls-row">
        <div class="archive-filters" role="group" aria-label="Filter archive records">
          <button type="button" class="archive-filter-btn active" data-filter="ALL">All</button>
          <button type="button" class="archive-filter-btn" data-filter="WORKS">Works</button>
          <button type="button" class="archive-filter-btn" data-filter="CERTIFICATES">Certificates</button>
        </div>
      </div>

      <!-- Archive Visual Grid (2-Col Desktop, 1-Col Mobile) -->
      <div id="archive-grid" class="archive-grid" aria-live="polite">
        <!-- Rendered dynamically by careers.js -->
      </div>
    </section>
  </main>

  <!-- Editorial Page Footer -->
  <footer class="careers-footer" role="contentinfo">
    <div class="careers-footer-inner">
      <div class="careers-footer-left">
        <span class="careers-footer-brand">.1VOYSY</span>
        <span class="careers-footer-sub">&copy; 2026 &bull; Architectural &amp; Creative Engineering</span>
      </div>

      <div class="careers-footer-right">
        <a href="/index.html#work" class="careers-footer-link">Selected Work</a>
        <a href="/index.html#about" class="careers-footer-link">About Me</a>
        <a href="/index.html#contact" class="careers-footer-link">Contact</a>
        <a href="/index.html" class="careers-footer-link">&larr; Back to Home</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/scripts/careers.js"></script>
</body>
</html>
