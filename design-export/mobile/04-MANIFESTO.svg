<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="1380" viewBox="0 0 390 1380" role="img" aria-label="04 — MANIFESTO (Mobile)">
  <title>04 — MANIFESTO (Mobile 390x1380)</title>
  
  <rect id="manifesto-bg" width="390" height="1380" fill="#0E1116"/>

  <g id="manifesto-meta-bar">
    <text id="manifesto-tag" x="16" y="78" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">[ 04 // MANIFESTO ]</text>
    <text id="manifesto-meta-labels" x="16" y="100" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">LEVEL • ROLLING • MULTI-COLORS • CRAFT</text>
  </g>

  <g id="manifesto-headline" fill="#FFFFFF" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="28" font-weight="400">
    <text x="16" y="180">Design and code are only tools of</text>
    <text x="16" y="215">expression. What sets our work apart</text>
    <text x="16" y="250">is thinking. Crafting bespoke</text>
    <text x="16" y="285">digital-first experiences.</text>
  </g>

  <!-- Mobile 3:4 Character Viewport -->
  <g id="manifesto-character-viewport">
    <rect id="character-viewport-frame" x="16" y="365" width="358" height="477" rx="2" fill="#13171F" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <image id="manifesto-character-img" href="../../public/assets/reference/unit-img-0.png" xlink:href="../../public/assets/reference/unit-img-0.png" x="16" y="365" width="358" height="477" preserveAspectRatio="xMidYMid slice"/>
    <text id="character-tag" x="31" y="822" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">[ SPECIMEN // 04 ]</text>
  </g>

  <!-- Mobile Left Column Copy -->
  <g id="manifesto-col-left">
    <g id="manifesto-description" fill="rgba(255, 255, 255, 0.64)" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      <text x="16" y="910">Leveraging meticulous craft and strategic foresight,</text>
      <text x="16" y="932">we build enduring digital platforms that redefine</text>
      <text x="16" y="954">user expectation and business performance.</text>
    </g>

    <g id="manifesto-talent-note">
      <circle cx="20" cy="1040" r="3.8" fill="#CEF023"/>
      <text x="35" y="1045" fill="rgba(255, 255, 255, 0.85)" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Always looking for top shelf talent.</text>
    </g>
  </g>

