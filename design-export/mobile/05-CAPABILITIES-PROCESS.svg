<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="1385" viewBox="0 0 390 1385" role="img" aria-label="05 — CAPABILITIES &amp; PROCESS (Mobile)">
  <title>05 — CAPABILITIES &amp; PROCESS (Mobile 390x1385)</title>
  
  <rect id="capabilities-bg" width="390" height="1385" fill="#0E1116"/>

  <g id="capabilities-header">
    <text id="capabilities-tag" x="16" y="82" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">[ 05 // CAPABILITIES &amp; PROCESS ]</text>
    <g id="capabilities-title" fill="#FFFFFF" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="32" font-weight="400">
      <text x="16" y="130">Capabilities</text>
      <text x="16" y="166">&amp; Process</text>
    </g>
    <text id="capabilities-meta" x="16" y="208" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">DIGITAL STRATEGY • ARCHITECTURAL WEB • CRAFT</text>
  </g>

  <!-- Sculpture &amp; Word Cloud -->
  <g id="capabilities-sculpture-composition">
    <image id="sculpture-img" href="../../public/assets/reference/capabalities-skills-work-img-0.png" xlink:href="../../public/assets/reference/capabalities-skills-work-img-0.png" x="115" y="276" width="160" height="172" preserveAspectRatio="xMidYMid meet"/>
    <g id="sculpture-word-cloud" fill="rgba(255, 255, 255, 0.28)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10" text-anchor="middle">
      <text x="195" y="335">CONCRETE | FRACTAL | CONCRETE</text>
      <text x="195" y="360">FRACTAL | SCULPTURE | FRACTAL | SCULPTURE</text>
      <text x="195" y="385">SCULPTURE | ARCHITECTURAL | SCULPTED DESIGN ↵</text>
      <text x="195" y="410">ARCHITECTURAL | DEVELOPMENT | ARCHITECTURAL DEV</text>
    </g>
  </g>

  <!-- Core Disciplines Panel -->
  <g id="capabilities-summary-col">
    <rect x="16" y="524" width="358" height="289" rx="2" fill="#13171F" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text id="panel-badge" x="42" y="568" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">[ CORE DISCIPLINES ]</text>
    <g id="panel-text" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <text x="42" y="605">DIGITAL STRATEGY,</text>
      <text x="42" y="628">DESIGN ENGINEERING,</text>
      <text x="42" y="651">WEB DEVELOPMENT</text>
      <text x="42" y="674">WORKFLOW, INTERFACE</text>
      <text x="42" y="697">DEVELOPMENT, AND</text>
      <text x="42" y="720">BRAND SYSTEMS.</text>
    </g>
    <rect id="explore-btn-border" x="42" y="749" width="168" height="38.5" rx="3" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text id="explore-btn-text" x="67" y="774" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Explore Stack →</text>
  </g>

  <!-- Divider -->
  <line id="capabilities-divider" x1="16" y1="880" x2="374" y2="880" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Additional Work Area -->
  <g id="additional-work-section">
    <text id="additional-tag" x="16" y="935" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">[ ARCHIVE // SELECTION ]</text>
    <text id="additional-title" x="16" y="980" fill="#FFFFFF" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="32" font-weight="500">Additional Work</text>
    <text id="additional-count" x="16" y="1015" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">[ 07 CURATED RESEARCH &amp; CLIENT ARTIFACTS ]</text>

    <!-- Filmstrip Cards (Mobile Card 01 visible, with scroll sequence) -->
    <g id="additional-filmstrip-cards">
      <g id="gallery-card-01">
        <rect x="16" y="1052" width="234" height="154" fill="#13171F" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <image href="../../public/assets/reference/capabalities-skills-work-img-1.png" xlink:href="../../public/assets/reference/capabalities-skills-work-img-1.png" x="17" y="1053" width="232" height="152" preserveAspectRatio="xMidYMid slice"/>
        <text x="16" y="1232" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">[ 01 ]</text>
        <text x="65" y="1232" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Black Foil Monograph</text>
      </g>
      <g id="gallery-card-02">
        <rect x="266" y="1052" width="234" height="154" fill="#13171F" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <image href="../../public/assets/reference/capabalities-skills-work-img-2.png" xlink:href="../../public/assets/reference/capabalities-skills-work-img-2.png" x="267" y="1053" width="232" height="152" preserveAspectRatio="xMidYMid slice"/>
        <text x="266" y="1232" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="10">[ 02 ]</text>
        <text x="315" y="1232" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Editorial Experiment</text>
      </g>
    </g>

    <!-- Mobile Controls -->
    <g id="additional-controls" fill="rgba(255, 255, 255, 0.85)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="12">
      <text x="35" y="1295">[ &lt; ]</text>
      <text x="125" y="1295">[ 01 ] / [ 07 ]</text>
      <text x="285" y="1295">[ &gt; ]</text>
    </g>
  </g>
</svg>