<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="01 — HERO (Mobile)">
  <title>01 — HERO (Mobile 390x844)</title>
  <defs>
    <linearGradient id="hero-sky-vignette-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect id="hero-bg" width="390" height="844" fill="#FFFFFF"/>

  <!-- Upper Visual Frame: Landscape -->
  <g id="hero-visual-frame">
    <image id="hero-landscape-img" href="../../public/assets/hero-textile-landscape-2k.jpg" xlink:href="../../public/assets/hero-textile-landscape-2k.jpg" x="0" y="0" width="390" height="704" preserveAspectRatio="xMidYMid slice"/>
    <rect id="hero-vignette" x="0" y="0" width="390" height="704" fill="url(#hero-sky-vignette-m)"/>

    <!-- Metadata Badge Resting on Pedestal -->
    <g id="hero-tag-badge">
      <rect id="badge-bg" x="24" y="679" width="128" height="25" rx="3" fill="#FFFFFF"/>
      <text id="badge-text" x="38" y="696" fill="#1E1E2F" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.54">[ UI / DEV ]</text>
    </g>
  </g>

  <!-- Mobile Navigation Header -->
  <g id="hero-header">
    <rect id="header-bg" x="0" y="0" width="390" height="61" fill="#FFFFFF"/>
    <text id="brand-text" x="20" y="42" fill="#111111" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.65">.1VOYSY</text>
    
    <!-- Mobile Hamburger Toggle -->
    <g id="hero-nav-toggle">
      <rect x="346" y="28" width="24" height="2" fill="#111111"/>
      <rect x="352" y="36" width="18" height="2" fill="#111111"/>
    </g>
  </g>

  <!-- Lower White Typographic Pedestal -->
  <g id="hero-pedestal">
    <rect id="pedestal-bg" x="0" y="704" width="390" height="140" fill="#FFFFFF"/>
    
    <g id="hero-headline">
      <text id="headline-creative-developer" x="24" y="760" fill="#1E1E2F" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="32.8" font-weight="500" letter-spacing="-0.82">Creative Developer</text>
      
      <g id="hero-year-lockup" transform="translate(24, 772)">
        <g id="hero-asterisk" fill="#1E1E2F" transform="scale(0.67)">
          <rect x="18" y="2" width="4" height="36" rx="0.5" />
          <rect x="2" y="18" width="36" height="4" rx="0.5" />
          <rect x="18" y="2" width="4" height="36" rx="0.5" transform="rotate(45 20 20)" />
          <rect x="18" y="2" width="4" height="36" rx="0.5" transform="rotate(-45 20 20)" />
        </g>
        <text id="headline-year" x="36" y="24" fill="#1E1E2F" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="32.8" font-weight="500" letter-spacing="-0.82">2026</text>
      </g>
    </g>
  </g>
</svg>