<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="847" viewBox="0 0 390 847" role="img" aria-label="02 — ABOUT ME (Mobile)">
  <title>02 — ABOUT ME (Mobile 390x847)</title>
  
  <rect id="about-bg" width="390" height="847" fill="#FFFFFF"/>

  <!-- Mobile Editorial Copy -->
  <g id="about-copy-column">
    <g id="about-headline" fill="#1E1E2F" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="30.4" font-weight="500" letter-spacing="-0.76">
      <text x="16" y="80">A MULTIDISCIPLINARY</text>
      <text x="16" y="111">CREATIVE DEVELOPER</text>
      <text x="16" y="142">BRIDGING CODE</text>
      <text x="16" y="173">PRECISION WITH BOLD</text>
      <text x="16" y="204">EDITORIAL DIRECTION.</text>
    </g>

    <g id="about-manifesto" fill="#65667A" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      <text x="16" y="252">Never choosing between emotion and technical depth.</text>
      <text x="16" y="278">Architecting interactive narratives and intelligent</text>
      <text x="16" y="304">pipelines with obsessive craft.</text>
    </g>
  </g>

  <!-- Mobile 3:4 Portrait Frame -->
  <g id="about-portrait-column">
    <g id="about-portrait-frame">
      <rect id="portrait-frame-border" x="35" y="370" width="320" height="427" rx="2" fill="#FAF9F6" stroke="rgba(30, 30, 47, 0.12)" stroke-width="1"/>
      <image id="about-portrait-img" href="../../public/assets/reference/about-me-img-1.png" xlink:href="../../public/assets/reference/about-me-img-1.png" x="36" y="371" width="318" height="425" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>
</svg>