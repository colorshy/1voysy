<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1213" viewBox="0 0 1920 1213" role="img" aria-label="05 — CAPABILITIES &amp; PROCESS (Desktop)">
  <title>05 — CAPABILITIES &amp; PROCESS (Desktop 1920x1213)</title>
  
  <rect id="capabilities-bg" width="1920" height="1213" fill="#0E1116"/>

  <!-- Part A: Capabilities Header -->
  <g id="capabilities-header">
    <text id="capabilities-tag" x="88" y="133" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="13">[ 05 // CAPABILITIES &amp; PROCESS ]</text>
    <g id="capabilities-title" fill="#FFFFFF" font-family="'PP Editorial New', 'Editorial New', 'Newsreader', 'Playfair Display', Georgia, serif" font-size="52" font-weight="400">
      <text x="88" y="210">Capabilities</text>
      <text x="88" y="267">&amp; Process</text>
    </g>
    <text id="capabilities-meta" x="88" y="325" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">DIGITAL STRATEGY • ARCHITECTURAL WEB • CRAFT</text>
  </g>

  <!-- Part B: Central Sculpture &amp; Word Cloud -->
  <g id="capabilities-sculpture-composition">
    <g id="sculpture-word-cloud" fill="rgba(255, 255, 255, 0.28)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="14">
      <text x="785" y="265">CONCRETE | FRACTAL | CONCRETE</text>
      <text x="725" y="295">FRACTAL | SCULPTURE | FRACTAL | SCULPTURE</text>
      <text x="705" y="325">SCULPTURE | ARCHITECTURAL | SCULPTED DESIGN ↵</text>
      <text x="665" y="355">ARCHITECTURAL | DEVELOPMENT | ARCHITECTURAL DEVELOPMENT</text>
    </g>

    <g id="sculpture-stage">
      <image id="sculpture-img" href="../public/assets/reference/capabalities-skills-work-img-0.png" xlink:href="../public/assets/reference/capabalities-skills-work-img-0.png" x="810" y="150" width="300" height="323" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <!-- Part C: Right-side Core Disciplines Panel -->
  <g id="capabilities-summary-col">
    <text id="panel-badge" x="1378" y="198" fill="rgba(255, 255, 255, 0.72)" font-family="'JetBrains Mono', 'Space Mono', 'Courier New', monospace" font-size="11">[ CORE DISCIPLINES ]</text>
    
    <g id="panel-text" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
