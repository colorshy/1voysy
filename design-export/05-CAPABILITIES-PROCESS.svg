      <text x="1378" y="271">DESIGN ENGINEERING,</text>
      <text x="1378" y="297">WEB DEVELOPMENT</text>
      <text x="1378" y="323">WORKFLOW, INTERFACE</text>
      <text x="1378" y="349">DEVELOPMENT, AND</text>
      <text x="1378" y="375">BRAND SYSTEMS.</text>
    </g>

    <g id="explore-stack-action">
      <rect id="explore-btn-border" x="1378" y="421" width="178" height="40" rx="3" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text id="explore-btn-text" x="1403" y="446" fill="#FFFFFF" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Explore Stack →</text>
    </g>
