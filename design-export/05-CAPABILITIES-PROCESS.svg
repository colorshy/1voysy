        <image id="card-05-img" href="../public/assets/reference/capabalities-skills-work-img-5.png" xlink:href="../public/assets/reference/capabalities-skills-work-img-5.png" x="1425" y="752" width="308" height="201" preserveAspectRatio="xMidYMid slice"/>
